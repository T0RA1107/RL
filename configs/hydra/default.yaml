# @package hydra
run:
  dir: ${path.log_dir}/${hydra.job.name}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
sweep:
  dir: ${path.log_dir}/${hydra.job.name}/multiruns/${now:%Y-%m-%d}/${now:%H-%M-%S}
  subdir: ${hydra.job.num}

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
  formatters:
      simple:
        datefmt: "%H:%M:%S"
  root:
    level: INFO
