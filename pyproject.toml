[project]
name = "rlernex"
version = "0.1.0"
description = "A modular reinforcement learning framework built with JAX, Flax, rlax, and Gymnax. Features Hydra configuration management."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "flax>=0.12.2",
    "jax[cuda12]>=0.8.2",
    "loguru>=0.7.3",
    "optax>=0.2.6",
    "rlax>=0.1.8",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "gymnax>=0.0.8",
    "wandb>=0.18.11",
    "chex>=0.1.86",
    "jaxlib>=0.8.2",
    "pyinstrument>=5.1.2",
    "jaxtyping>=0.3.5",
    "gymnasium[classic-control]>=1.2.3",
]
